<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://harshbarnawa.in/" />
    <!-- Primary Meta Tags -->
    <title>Harsh Barnawa — Portfolio</title>
    <meta name="title" content="Harsh Barnawa — Portfolio" />
    <meta
      name="description"
      content="Software engineer building full-stack applications, backend systems, and real products. Explore projects, engineering work, and contact details."
    />
    <meta name="keywords" content="Harsh Barnawa, portfolio, full-stack developer, web developer, React, Go, competitive programming" />
    <meta name="author" content="Harsh Barnawa" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harshbarnawa.in/" />
    <meta property="og:title" content="Harsh Barnawa — Portfolio" />
    <meta
      property="og:description"
      content="Software engineer building full-stack applications, backend systems, and real products. Explore projects, engineering work, and contact details."
    />
    <meta property="og:image" content="https://harshbarnawa.in/me.jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://harshbarnawa.in/" />
    <meta property="twitter:title" content="Harsh Barnawa — Portfolio" />
    <meta
      property="twitter:description"
      content="Software engineer building full-stack applications, backend systems, and real products. Explore projects, engineering work, and contact details."
    />
    <meta property="twitter:image" content="https://harshbarnawa.in/me.jpeg" />

    <!-- Preconnect for external resources -->
    <link rel="preconnect" href="https://ghchart.rshah.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (() => {
        try {
          const themeNames = {
            aurora: "aurora",
            liquid: "liquid",
            monochrome: "monochrome",
            brutal: "Neo-Brutalism",
            bento: "bento-universe",
            luxury: "dark-luxury",
            editorial: "editorial-swiss",
            clay: "clay-morphism",
            retro: "retro-futurism",
            maximal: "maximalist-collage"
          };
          const savedTheme = localStorage.getItem("portfolioTheme");
          const theme = themeNames[savedTheme] || "aurora";
          const mode = localStorage.getItem("portfolioMode") === "dark" ? "dark" : "light";
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.fetchPriority = "high";
          preload.href = `/assets/backgrounds/${mode}-${theme}-v1.webp`;
          document.head.appendChild(preload);
        } catch {}
      })();
    </script>

    <!-- Theme color -->
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ededeb" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
